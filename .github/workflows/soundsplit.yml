name: SoundSplit (Windows app)

on:
  push:
    branches: ["**"]
    paths:
      - "SoundSplit/**"
      - ".github/workflows/soundsplit.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "SoundSplit/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build single-file SoundSplit.exe
        working-directory: SoundSplit
        run: >
          dotnet publish SoundSplit.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SoundSplit-windows
          path: SoundSplit/publish/SoundSplit.exe

      # Pushing a tag like v1.0.1 creates a GitHub Release with the .exe attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SoundSplit/publish/SoundSplit.exe
          generate_release_notes: true
          body: |
            ## SoundSplit ${{ github.ref_name }}
            Pick which speaker or headphones each app plays on in Windows 10/11.

            **Download `SoundSplit.exe` below**, double-click it, and if Windows shows
            "Windows protected your PC" click **More info → Run anyway**.

            New here? Read the [step-by-step tutorial](https://github.com/${{ github.repository }}/blob/main/SoundSplit/README.md).
