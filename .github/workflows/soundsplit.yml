name: SoundSplit (Windows app)

on:
  push:
    branches: ["**"]
    paths:
      - "SoundSplit/**"
      - ".github/workflows/soundsplit.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "SoundSplit/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. v1.0.2 (leave empty to just build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build single-file SoundSplit.exe
        working-directory: SoundSplit
        run: >
          dotnet publish SoundSplit.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SoundSplit-windows
          path: SoundSplit/publish/SoundSplit.exe

      # Two ways to publish a GitHub Release with the .exe attached:
      #  - push a tag like v1.0.2, or
      #  - Actions tab -> "SoundSplit (Windows app)" -> Run workflow -> type a version.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: SoundSplit ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: SoundSplit/publish/SoundSplit.exe
          generate_release_notes: true
          body: |
            Download `SoundSplit.exe` below. Windows 10 1803+ / Windows 11, no install required.
            The exe is unsigned; if SmartScreen appears, choose *More info → Run anyway*.
